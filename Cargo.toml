[workspace]
members = ["./crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
readme = "README.md"
repository = "https://github.com/matharts/ziwei"

[workspace.dependencies]
ziwei = { path = "crates/ziwei" }

[workspace.lints.rust]
missing_docs = "warn"
