name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Install Rust components
        run: mise exec -- rustup component add rustfmt clippy && mise exec -- rustup target add wasm32-unknown-unknown
      - name: Show toolchain
        run: mise exec -- rustup show active-toolchain
      - name: Check format
        run: mise exec -- cargo fmt --all -- --check
      - name: Run Clippy
        run: mise exec -- cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: mise exec -- cargo test --workspace --locked
      - name: Check WebAssembly adapter
        run: mise exec -- cargo clippy --target wasm32-unknown-unknown --package ziwei_binding --locked -- -D warnings
      - name: Install Node dependencies
        run: mise exec -- pnpm install --frozen-lockfile
      - name: Check binding package format
        run: mise exec -- pnpm exec oxfmt --check bindings scripts tests/bindings packages/core packages/core-wasm
      - name: Build Node binding
        run: mise exec -- pnpm --filter @ziweijs/core build
      - name: Test Node binding
        run: mise exec -- pnpm --filter @ziweijs/core test && mise exec -- pnpm --filter @ziweijs/core test:types
      - name: Build WebAssembly binding
        run: mise exec -- pnpm --filter @ziweijs/core-wasm build
      - name: Test WebAssembly binding
        run: mise exec -- pnpm --filter @ziweijs/core-wasm test && mise exec -- pnpm --filter @ziweijs/core-wasm test:types
