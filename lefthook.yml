pre-commit:
  parallel: true
  jobs:
    - name: Rust format
      run: cargo fmt --all -- --check
      glob: "*.{rs,toml}"
      stage_fixed: true

    - name: Rust Clippy
      run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      glob: "*.{rs,toml,lock}"
      stage_fixed: true
