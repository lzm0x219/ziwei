  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-soft: #7a8399;
      --color-accent: #eb6c36;

      --font-serif: 'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
      color: var(--color-ink);
      background: var(--color-paper);
      font-family: var(--font-sans);
    }

    .frame { width: 100%; max-width: 1200px; }

    .eyebrow {
      margin-bottom: 0.5rem;
      color: var(--color-muted);
      font-family: var(--font-mono);
      font-size: 0.625rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 0.625rem;
      color: var(--color-ink);
      font-family: var(--font-serif);
      font-size: clamp(1.75rem, 2.4vw + 0.75rem, 2.5rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .subtitle {
      max-width: 64rem;
      margin-bottom: 1.5rem;
      color: var(--color-muted);
      font-size: 0.875rem;
      line-height: 1.65;
    }

    .diagram-scroll { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 1000px; }

    .colophon {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(45, 49, 66, 0.12);
      color: var(--color-soft);
      font-family: var(--font-mono);
      font-size: 0.625rem;
      letter-spacing: 0.04em;

  </style>
